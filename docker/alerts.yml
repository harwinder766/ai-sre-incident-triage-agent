groups:
  - name: payment-api-alerts

    rules:
      - alert: HighPaymentErrorRate
        expr: |
          (
            rate(payment_errors_total[1m])
            /
            rate(payment_requests_total[1m])
          ) > 0.30
        for: 30s
        labels:
          severity: critical
          service: payment-api
        annotations:
          summary: "High payment API error rate"
          description: "Payment API error rate has exceeded 30% for 30 seconds."

      - alert: HighPaymentLatency
        expr: |
          rate(payment_request_duration_seconds_sum[1m])
          /
          rate(payment_request_duration_seconds_count[1m])
          > 2
        for: 30s
        labels:
          severity: warning
          service: payment-api
        annotations:
          summary: "High payment API latency"
          description: "Average payment API latency has exceeded 2 seconds for 30 seconds."